<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dbeafe, #f1f5f9);
        }

        /* MAIN BOX */
        .forgot-container {
            width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
        }

        /* HEADING */
        h2 {
            text-align: center;
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* INPUT */
        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 15px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 15px;
            transition: 0.3s ease;
        }

        .input-box input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        /* BUTTON */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25);
        }

        .btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #172554);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* ERROR */
        .error {
            background: #fef2f2;
            color: #dc2626;
            border-left: 4px solid #dc2626;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        /* BACK TO LOGIN */
        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .forgot-container {
                width: 100%;
                padding: 25px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Enter your username and registered email
            to verify your account.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="input-box">

                <label>Registered Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required>

            </div>


            <button
                type="submit"
                name="verify"
                class="btn">
                Verify Account
            </button>

        </form>


        <a href="{% url 'login' %}" class="back-login">
            ← Back to Login
        </a>

    </div>

</body>
</html>
