<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback</title>
<style>
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #f1f5f9, #e0f2fe);
        min-height: 100vh;
        color: #1e293b;
    }

    /* FEEDBACK CONTAINER */
    .feed-container {
        width: 90%;
        max-width: 1100px;
        min-height: 70vh;
        margin: 40px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
    }

    /* FEEDBACK BOX */
    .feedback-box {
        width: 500px;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        border: 1px solid #e2e8f0;
    }

    h2 {
        text-align: center;
        color: #1d4ed8;
        margin-bottom: 30px;
        font-size: 30px;
    }

    h2::after {
        content: "";
        display: block;
        width: 55px;
        height: 4px;
        background: #38bdf8;
        margin: 10px auto 0;
        border-radius: 5px;
    }

    /* INPUT */
    .input {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #334155;
        font-size: 15px;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 16px;
        background: #f8fafc;
        color: #1e293b;
        transition: 0.3s;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: none;
        border-color: #2563eb;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    /* BUTTON */
    .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
}

.btn:hover {
    background: linear-gradient(135deg, #1d4ed8, #0f172a);
    transform: translateY(-2px);
}


    /* FOOTER */
    footer {
        background: linear-gradient(135deg, #0f172a, #020617);
        color: white;
        text-align: center;
        padding: 25px 15px;
        width: 100%;
        margin-top: 40px;
        border-top: 3px solid #2563eb;
    }

    footer p {
        margin: 6px 0;
        color: #cbd5e1;
        font-size: 14px;
    }

    footer p:first-child {
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
    }

    footer p:last-child {
        color: #64748b;
        font-size: 13px;
    }

    /* MOBILE */
    @media (max-width: 700px) {

        .feed-container {
            width: 92%;
            min-height: auto;
            margin: 30px auto;
            gap: 25px;
        }

        .feedback-box {
            width: 100%;
            padding: 25px;
        }

        h2 {
            font-size: 26px;
        }
    }
</style>
</style>
</head>
<body>
    {% include "navbar.html" %}
    <h2 style="text-align:center; margin-top:20px;">Feedback</h2>

<form method="POST">
    {% csrf_token %}

    <div class="input">
        <label>Student Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>
    </div>

    <div class="input">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="input">
        <label>Your Feedback</label>
        <textarea name="feedback" placeholder="Write your feedback here..." required></textarea>
    </div>

    <button type="submit" class="btn">
        Submit Feedback
    </button>
</form>
</body>
</html>
