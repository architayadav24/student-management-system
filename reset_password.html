<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #f1f5f9
            );
        }

        .reset-container {
            width: 420px;
            background: white;
            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.15);

            border: 1px solid #e2e8f0;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;

            color: #334155;
            font-size: 15px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            background: #f8fafc;

            font-size: 15px;
            color: #1e293b;

            transition: 0.3s;
        }

        .input-box input:focus {
            outline: none;

            border-color: #2563eb;

            background: white;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 5px 12px rgba(37, 99, 235, 0.25);
        }

        .btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #172554
                );

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.35);
        }

        .error {
            background: #fef2f2;
            color: #dc2626;

            border-left: 4px solid #dc2626;

            padding: 11px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .back-login {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .reset-container {
                width: 100%;
                padding: 25px;
            }

            h2 {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

    <div class="reset-container">

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a new password for your account.
        </p>


        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="input-box">

                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <div class="input-box">

                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

            </div>


            <button
                type="submit"
                name="reset"
                class="btn">

                Reset Password

            </button>

        </form>


        <a
            href="{% url 'login' %}"
            class="back-login">

            ← Back to Login

        </a>

    </div>

</body>
</html>
