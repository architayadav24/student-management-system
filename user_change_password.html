<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>change_password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing:border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        body{
            background-color: #f4f6f9;
            display:flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

       .box{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}
        .box h2{
            text-align: center;
            color: #ff6600;
            margin-bottom: 25px;
        }

        .input-box{
            position: relative;
            margin-bottom: 18px;
            
        }

    .input-box input{
    width:100%;
    padding:12px 12px 12px 40px;
    border:1px solid #ccc;
    outline:none;
    border-radius:8px;
    font-size:15px;
}
.input-box i{
            position: absolute;
            left: 12px;
            top:14px;
            color:#777;
            
        }
        button{
            width:100%;
            padding:12px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

         .back{
        position: fixed;
        bottom:20px;
        right:20px;
        text-decoration: none;
        background-color: #ff6600; 
        color:wheat;
        padding:10px 18px;
        font-size: 16px;
        box-shadow: 0 4px 8px rgba(0 0 0 0.1);
        border-radius: 10px;

    }
    </style>

</head>
<body>

    <div class="box">
        <h2>Change Password</h2>
        <form onsubmit="return change_pass()" action="{% url 'user_update_pass' %}">
            {% csrf_token %}
<form method="POST" onsubmit="return change_pass()" action="{% url 'user_update_pass' %}">
    <div class="input-box">
        <i class="fa-solid fa-lock" style="color: rgb(177, 151, 252);"></i>
        <input type="password" name="old_pass" placeholder="enter old password">
    </div>
    
    <div class="input-box">
        <i class="fa-solid fa-key" style="color: rgb(65, 64, 66);"></i>
        <input type="password" name="new_pass" placeholder="enter new password">
    </div>
    
    <div class="input-box">
        <i class="fa-regular fa-circle-check" style="color: rgb(85, 84, 86);"></i>
        <input type="password" name="conf_pass" placeholder="confirm password">
    </div>

    <button type="submit">Update Password <i class="fa-solid fa-rotate" style="color: rgb(69, 69, 71);"></i></button>
</form>
</div>
   <a href="{% url 'student_home' %}" class="back">Back to Dashboard</a>
<script>
function change_pass() {

    let newPass = document.getElementsByName("new_pass")[0].value;
    let confPass = document.getElementsByName("conf_pass")[0].value;

    if (newPass !== confPass) {
        alert("Passwords do not match.");
        return false;
    }

    return true;
}
</script>
{% if error == "done" %}
<script>
    alert("passwrd changed successfully")
</script>

{% elif error %}
<script>
    alert("{{error}}")
</script>
{% endif %}
</body>
</html>
